# ============================================================
# Convix — stack de desarrollo/despliegue del ecosistema H&M Business
#
#   docker compose up -d db            # solo Postgres (dev local)
#   docker compose up -d db minio      # + storage S3-compatible
#   docker compose --profile full up   # stack completo con la app
#
# La app también corre fuera de Docker (npm run dev / next start):
# solo necesita DATABASE_URL.
# ============================================================

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convix
    ports:
      - '5432:5432'
    volumes:
      - convix-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d convix']
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatible (estándar del ecosistema H&M). Opcional:
  # sin él, la app usa disco local (STORAGE_DRIVER=local).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - convix-minio:/data

  # SMTP de desarrollo — captura los emails de reseteo de contraseña.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  app:
    profiles: ['full']
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/convix
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generar con node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"}
      META_APP_SECRET: ${META_APP_SECRET:?Meta App Secret requerido}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-convix}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Vaultex}
    ports:
      - '3000:3000'
    volumes:
      - convix-storage:/app/data

volumes:
  convix-db:
  convix-minio:
  convix-storage:
