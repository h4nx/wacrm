# ============================================================
# Convix — despliegue LOCAL completo (proyecto: convix-dev)
#
#   docker compose -p convix-dev -f docker-compose.local.yml \
#     --env-file .env.convix-dev up -d --build
#
# Puertos en el host (el resto de servicios son solo internos):
#   1000 → app        http://localhost:1000
#   1001 → Mailpit UI http://localhost:1001  (emails de reseteo)
#   1002 → MinIO UI   http://localhost:1002  (minioadmin/minioadmin)
#
# Secretos en .env.convix-dev (gitignored). Este archivo es para el
# stack local; el despliegue de producción usa docker-compose.yml.
# ============================================================

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convix
    volumes:
      - convix-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d convix']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - convix-dev-kafka:/var/lib/kafka/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '1002:9001'
    volumes:
      - convix-dev-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea el bucket `convix` una vez y termina.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/convix
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1001:8025'

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/convix
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?definir en .env.convix-dev}
      META_APP_SECRET: ${META_APP_SECRET:?definir en .env.convix-dev}
      NEXT_PUBLIC_SITE_URL: http://localhost:1000
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: convix
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: 'Convix <no-reply@convix.one>'
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: convix
      KAFKA_TOPIC_PREFIX: convix
    ports:
      - '1000:3000'

volumes:
  convix-dev-db:
  convix-dev-kafka:
  convix-dev-minio:
